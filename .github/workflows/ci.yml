name: CI

on:
  push:
    branches: ["master", "test"]
    tags: ["v*"]
  pull_request:
    branches: ["master", "test"]

jobs:
  test:
    name: Windows test baseline
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile
        run: python -m compileall -q src tests scripts

      - name: Ruff
        run: python -m ruff check src tests scripts

      - name: Mypy
        run: python -m mypy

      - name: Pytest with coverage
        run: python -m pytest --cov=src --cov-report=term-missing --cov-fail-under=80

  packaging:
    name: Windows packaging smoke
    if: github.event_name == 'push'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Packaging tests
        run: python -m pytest -m packaging -q

      - name: Build onedir package
        run: >-
          python -m PyInstaller build_std.spec --clean --noconfirm
          --distpath ci-dist --workpath ci-build

      - name: Verify package contents
        shell: pwsh
        run: |
          $required = @(
            "ci-dist\QuickRec\QuickRec.exe",
            "ci-dist\QuickRec\_internal\ffmpeg\ffmpeg.exe",
            "ci-dist\QuickRec\_internal\ffmpeg\ffprobe.exe"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Missing packaging artifact: $path"
            }
          }
          & "ci-dist\QuickRec\_internal\ffmpeg\ffprobe.exe" -version
