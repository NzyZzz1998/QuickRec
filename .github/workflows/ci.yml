name: QuickRec Lite CI

permissions:
  contents: read

on:
  push:
    branches: ["lite-master", "lite-test"]
    tags: ["lite-v*"]
  pull_request:
    branches: ["lite-master", "lite-test"]

jobs:
  test:
    name: Lite Windows test baseline
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile
        run: python -m compileall -q src tests

      - name: Ruff
        run: python -m ruff check src scripts tests

      - name: Mypy
        run: python -m mypy

      - name: Pytest with coverage
        run: python -m pytest --cov=src --cov-report=term-missing --cov-fail-under=80

      - name: Core module coverage
        run: >-
          python -m coverage report
          --include="src/config.py,src/utils/config_migration.py,src/utils/product_identity.py,src/utils/single_instance.py,src/recorder/frame_schedule.py"
          --fail-under=85

      - name: Coordination module coverage
        run: >-
          python -m coverage report
          --include="src/ui/config_migration_dialog.py,src/hotkey/hotkey_manager.py,src/recorder/recorder_manager.py,src/recorder/workflow.py"
          --fail-under=80

  packaging:
    name: Lite Windows packaging smoke
    if: github.event_name == 'push'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Stage locked FFmpeg
        run: python scripts/stage_ffmpeg.py --output ffmpeg/ffmpeg.exe

      - name: Packaging tests
        run: python -m pytest -m packaging -q

      - name: Build Lite onedir package
        run: >-
          python -m PyInstaller build_std.spec --clean --noconfirm
          --distpath ci-dist --workpath ci-build

      - name: Verify Lite package contents
        shell: pwsh
        run: |
          $required = @(
            "ci-dist\QuickRec-Lite\QuickRec-Lite.exe",
            "ci-dist\QuickRec-Lite\_internal\ffmpeg\ffmpeg.exe"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Missing Lite packaging artifact: $path"
            }
          }
          python scripts/stage_ffmpeg.py --verify-only --output "ci-dist\QuickRec-Lite\_internal\ffmpeg\ffmpeg.exe"

      - name: Create release ZIP and manifest
        shell: pwsh
        run: |
          Compress-Archive -LiteralPath "ci-dist\QuickRec-Lite" -DestinationPath "ci-dist\QuickRec-Lite-v0.1-win-x64.zip"
          python scripts/release_manifest.py `
            --package-dir "ci-dist\QuickRec-Lite" `
            --zip "ci-dist\QuickRec-Lite-v0.1-win-x64.zip" `
            --output "ci-dist\release-manifest.json" `
            --version "v0.1"

      - name: Upload Lite package evidence
        uses: actions/upload-artifact@v7
        with:
          name: QuickRec-Lite-v0.1-${{ github.sha }}
          path: |
            ci-dist/QuickRec-Lite-v0.1-win-x64.zip
            ci-dist/release-manifest.json
