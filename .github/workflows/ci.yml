name: CI

permissions:
  contents: read

on:
  push:
    branches: ["master", "test"]
    tags: ["v*"]
  pull_request:
    branches: ["master", "test"]

jobs:
  test:
    name: Windows test baseline
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile
        run: python -m compileall -q src tests scripts

      - name: Ruff
        run: python -m ruff check src tests scripts

      - name: Mypy
        run: python -m mypy

      - name: Pytest with coverage
        run: python -m pytest --cov=src --cov-report=term-missing --cov-fail-under=80

  packaging:
    name: Windows packaging smoke
    if: github.event_name == 'push'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Packaging tests
        run: python -m pytest -m packaging -q

      - name: Stage FFmpeg tools
        shell: pwsh
        run: |
          choco install ffmpeg --no-progress -y

          $packageRoot = Join-Path $env:ChocolateyInstall "lib\ffmpeg"
          if (-not (Test-Path -LiteralPath $packageRoot -PathType Container)) {
            throw "Chocolatey FFmpeg package directory was not found: $packageRoot"
          }

          $ffmpegSource = Get-ChildItem -LiteralPath $packageRoot -Recurse -File -Filter "ffmpeg.exe" |
            Where-Object { $_.Length -gt 1MB } |
            Select-Object -First 1
          $ffprobeSource = Get-ChildItem -LiteralPath $packageRoot -Recurse -File -Filter "ffprobe.exe" |
            Where-Object { $_.Length -gt 1MB } |
            Select-Object -First 1

          if ($null -eq $ffmpegSource -or $null -eq $ffprobeSource) {
            throw "Real FFmpeg and FFprobe executables were not found in $packageRoot"
          }

          New-Item -ItemType Directory -Path "ffmpeg" -Force | Out-Null
          Copy-Item -LiteralPath $ffmpegSource.FullName -Destination "ffmpeg\ffmpeg.exe"
          Copy-Item -LiteralPath $ffprobeSource.FullName -Destination "ffmpeg\ffprobe.exe"

          foreach ($path in @("ffmpeg\ffmpeg.exe", "ffmpeg\ffprobe.exe")) {
            $file = Get-Item -LiteralPath $path
            if ($file.Length -le 1MB) {
              throw "Staged media tool is not a real executable: $path"
            }
          }

          & "ffmpeg\ffmpeg.exe" -version
          & "ffmpeg\ffprobe.exe" -version

      - name: Build onedir package
        run: >-
          python -m PyInstaller build_std.spec --clean --noconfirm
          --distpath ci-dist --workpath ci-build

      - name: Verify package contents
        shell: pwsh
        run: |
          $required = @(
            "ci-dist\QuickRec\QuickRec.exe",
            "ci-dist\QuickRec\_internal\ffmpeg\ffmpeg.exe",
            "ci-dist\QuickRec\_internal\ffmpeg\ffprobe.exe"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Missing packaging artifact: $path"
            }
          }
          & "ci-dist\QuickRec\_internal\ffmpeg\ffprobe.exe" -version
