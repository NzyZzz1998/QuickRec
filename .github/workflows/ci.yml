name: CI

permissions:
  contents: read

on:
  push:
    branches: ["master", "test"]
    tags: ["v*"]
  pull_request:
    branches: ["master", "test"]

jobs:
  test:
    name: Windows test baseline
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile
        run: python -m compileall -q src tests scripts

      - name: Ruff
        run: python -m ruff check src tests scripts

      - name: Mypy
        run: python -m mypy

      - name: Stage FFmpeg tools
        shell: pwsh
        run: |
          choco install ffmpeg --no-progress -y

          $packageRoot = Join-Path $env:ChocolateyInstall "lib\ffmpeg"
          if (-not (Test-Path -LiteralPath $packageRoot -PathType Container)) {
            throw "Chocolatey FFmpeg package directory was not found: $packageRoot"
          }

          $ffmpegSource = Get-ChildItem -LiteralPath $packageRoot -Recurse -File -Filter "ffmpeg.exe" |
            Where-Object { $_.Length -gt 1MB } |
            Select-Object -First 1
          $ffprobeSource = Get-ChildItem -LiteralPath $packageRoot -Recurse -File -Filter "ffprobe.exe" |
            Where-Object { $_.Length -gt 1MB } |
            Select-Object -First 1

          if ($null -eq $ffmpegSource -or $null -eq $ffprobeSource) {
            throw "Real FFmpeg and FFprobe executables were not found in $packageRoot"
          }

          New-Item -ItemType Directory -Path "ffmpeg" -Force | Out-Null
          Copy-Item -LiteralPath $ffmpegSource.FullName -Destination "ffmpeg\ffmpeg.exe"
          Copy-Item -LiteralPath $ffprobeSource.FullName -Destination "ffmpeg\ffprobe.exe"

          foreach ($path in @("ffmpeg\ffmpeg.exe", "ffmpeg\ffprobe.exe")) {
            $file = Get-Item -LiteralPath $path
            if ($file.Length -le 1MB) {
              throw "Staged media tool is not a real executable: $path"
            }
          }

          & "ffmpeg\ffmpeg.exe" -version
          & "ffmpeg\ffprobe.exe" -version

      - name: Pytest with coverage
        run: >-
          python -m pytest --cov=src --cov-report=term-missing
          --cov-report=json:build/coverage.json --cov-fail-under=80

      - name: Incremental coverage gates
        run: python scripts/check_incremental_coverage.py build/coverage.json

  packaging:
    name: Windows packaging smoke
    if: github.event_name == 'push'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Packaging tests
        run: python -m pytest -m packaging -q

      - name: Stage FFmpeg tools
        shell: pwsh
        run: |
          choco install ffmpeg --no-progress -y

          $packageRoot = Join-Path $env:ChocolateyInstall "lib\ffmpeg"
          if (-not (Test-Path -LiteralPath $packageRoot -PathType Container)) {
            throw "Chocolatey FFmpeg package directory was not found: $packageRoot"
          }

          $ffmpegSource = Get-ChildItem -LiteralPath $packageRoot -Recurse -File -Filter "ffmpeg.exe" |
            Where-Object { $_.Length -gt 1MB } |
            Select-Object -First 1
          $ffprobeSource = Get-ChildItem -LiteralPath $packageRoot -Recurse -File -Filter "ffprobe.exe" |
            Where-Object { $_.Length -gt 1MB } |
            Select-Object -First 1

          if ($null -eq $ffmpegSource -or $null -eq $ffprobeSource) {
            throw "Real FFmpeg and FFprobe executables were not found in $packageRoot"
          }

          New-Item -ItemType Directory -Path "ffmpeg" -Force | Out-Null
          Copy-Item -LiteralPath $ffmpegSource.FullName -Destination "ffmpeg\ffmpeg.exe"
          Copy-Item -LiteralPath $ffprobeSource.FullName -Destination "ffmpeg\ffprobe.exe"

          foreach ($path in @("ffmpeg\ffmpeg.exe", "ffmpeg\ffprobe.exe")) {
            $file = Get-Item -LiteralPath $path
            if ($file.Length -le 1MB) {
              throw "Staged media tool is not a real executable: $path"
            }
          }

          & "ffmpeg\ffmpeg.exe" -version
          & "ffmpeg\ffprobe.exe" -version

      - name: Build onedir package
        run: >-
          python -m PyInstaller build_std.spec --clean --noconfirm
          --distpath ci-dist --workpath ci-build

      - name: Verify package contents
        shell: pwsh
        run: |
          $required = @(
            "ci-dist\QuickRec\QuickRec.exe",
            "ci-dist\QuickRec\QuickRecCLI.exe",
            "ci-dist\QuickRec\_internal\ffmpeg\ffmpeg.exe",
            "ci-dist\QuickRec\_internal\ffmpeg\ffprobe.exe"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Missing packaging artifact: $path"
            }
          }
          if (-not (Test-Path -LiteralPath "ci-dist\QuickRec\_internal\av\_core.pyd")) {
            throw "Missing PyAV runtime extension: ci-dist\QuickRec\_internal\av\_core.pyd"
          }
          $avCodec = Get-ChildItem -LiteralPath "ci-dist\QuickRec\_internal\av.libs" -File -Filter "avcodec-*.dll" |
            Select-Object -First 1
          if ($null -eq $avCodec) {
            throw "Missing PyAV codec runtime in ci-dist\QuickRec\_internal\av.libs"
          }
          & "ci-dist\QuickRec\_internal\ffmpeg\ffprobe.exe" -version

      - name: Verify frozen CLI
        shell: pwsh
        run: |
          $cli = "ci-dist\QuickRec\QuickRecCLI.exe"
          $doctorJson = & $cli doctor --json
          if ($LASTEXITCODE -ne 0) {
            throw "QuickRecCLI doctor failed with exit code $LASTEXITCODE"
          }
          $doctor = $doctorJson | ConvertFrom-Json
          if ($doctor.schema_version -ne 1 -or
              $doctor.status -ne "success" -or
              $doctor.identity.frozen -ne $true) {
            throw "QuickRecCLI doctor returned an invalid JSON contract"
          }

          New-Item -ItemType Directory -Path "ci-cli\media" -Force | Out-Null
          & "ci-dist\QuickRec\_internal\ffmpeg\ffmpeg.exe" `
            -y -f lavfi -i "testsrc2=size=640x360:rate=30" `
            -t 1 -c:v libx264 -pix_fmt yuv420p "ci-cli\media\sample.mp4"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create controlled CLI media"
          }

          $probeJson = & $cli probe "ci-cli\media\sample.mp4" --json
          if ($LASTEXITCODE -ne 0) {
            throw "QuickRecCLI probe failed with exit code $LASTEXITCODE"
          }
          $probe = $probeJson | ConvertFrom-Json
          if ($probe.result.width -ne 640 -or $probe.result.height -ne 360) {
            throw "QuickRecCLI probe returned unexpected metadata"
          }

          $smokeJson = & $cli smoke --suite editing `
            --workspace "ci-cli\workspace" `
            --evidence-dir "ci-cli\evidence" --json
          if ($LASTEXITCODE -ne 0) {
            throw "QuickRecCLI editing smoke failed with exit code $LASTEXITCODE"
          }
          $smoke = $smokeJson | ConvertFrom-Json
          if ($smoke.result.timeline_schema -ne 2 -or
              $smoke.result.input_unchanged -ne $true) {
            throw "QuickRecCLI editing smoke returned unexpected results"
          }

          $timelineJson = & $cli timeline validate `
            "ci-cli\evidence\editing-smoke-project.qrproj" --json
          if ($LASTEXITCODE -ne 0) {
            throw "QuickRecCLI timeline validate failed with exit code $LASTEXITCODE"
          }
