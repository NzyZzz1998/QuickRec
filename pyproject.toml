[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m \"not hardware and not packaging\""
markers = [
  "unit: fast tests that do not require real desktop, audio, or package artifacts",
  "ui: PyQt widget tests that can run headless with offscreen Qt",
  "hardware: tests requiring real desktop capture, audio devices, or Windows shell state",
  "packaging: PyInstaller or bundled binary smoke tests",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
  "src/main.py",
  "src/rthook_dllpath.py",
  "src/ui/area_selector.py",
  "src/ui/click_highlighter.py",
  "src/ui/settings_dialog.py",
  "src/ui/toolbar.py",
  "src/ui/tray_icon.py",
  "src/ui/window_highlighter.py",
  "src/ui/window_selector.py",
  "src/recorder/audio_capturer.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests", "scripts"]
extend-exclude = [
  "src/main.py",
  "src/ui/area_selector.py",
  "src/ui/click_highlighter.py",
  "src/ui/settings_dialog.py",
  "src/ui/toolbar.py",
  "src/ui/tray_icon.py",
  "src/ui/window_highlighter.py",
  "src/ui/window_selector.py",
  "src/recorder/audio_capturer.py",
  "tests/test_area_selector.py",
  "tests/test_config.py",
  "tests/test_disk_checker.py",
  "tests/test_file_namer.py",
  "tests/test_settings_dialog.py",
  "tests/test_toolbar.py",
  "tests/test_tray_icon.py",
  "tests/test_v1_2.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = [
  "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = false
warn_unused_ignores = true
